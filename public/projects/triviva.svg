<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04120f" />
      <stop offset="50%" stop-color="#06211a" />
      <stop offset="100%" stop-color="#020806" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow-filter-3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="dot-grid-3" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#34d399" fill-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="url(#bg-grad-3)" />
  <rect width="1200" height="700" fill="url(#dot-grid-3)" />

  <circle cx="580" cy="350" r="280" fill="#059669" fill-opacity="0.09" filter="url(#glow-filter-3)" />

  <!-- Header -->
  <g transform="translate(60, 50)">
    <text font-family="monospace" font-size="12" fill="#34d399" letter-spacing="2">SYSTEM ID: TRIVIVA-AGENT-V1 // CONTEXTUAL ITINERARY SYNTHESIZER</text>
    <text x="960" y="0" font-family="monospace" font-size="12" fill="#71717a" letter-spacing="1">ENGINE: GENERATIVE AI</text>
    <line x1="0" y1="15" x2="1080" y2="15" stroke="#134e4a" stroke-width="1" />
  </g>

  <!-- Step 1: User Constraints -->
  <g transform="translate(80, 160)">
    <rect width="200" height="340" rx="12" fill="#06201b" stroke="#134e4a" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="40" rx="12" fill="#0f3d36" />
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ecfdf5">01 // CONSTRAINTS</text>

    <g transform="translate(20, 65)">
      <rect width="160" height="42" rx="6" fill="#0b2e27" stroke="#115e59" />
      <text x="12" y="18" font-family="monospace" font-size="9" fill="#a7f3d0">BUDGET TIER</text>
      <text x="12" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Moderate ($180/day)</text>
    </g>

    <g transform="translate(20, 120)">
      <rect width="160" height="42" rx="6" fill="#0b2e27" stroke="#115e59" />
      <text x="12" y="18" font-family="monospace" font-size="9" fill="#a7f3d0">PACE & DURATION</text>
      <text x="12" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">5 Days // Cultural Focus</text>
    </g>

    <g transform="translate(20, 175)">
      <rect width="160" height="42" rx="6" fill="#0b2e27" stroke="#115e59" />
      <text x="12" y="18" font-family="monospace" font-size="9" fill="#a7f3d0">TRANSIT PREFERENCE</text>
      <text x="12" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">High Walkability / Metro</text>
    </g>

    <text x="20" y="295" font-family="monospace" font-size="11" fill="#6ee7b7">Traveler Preference Matrix</text>
    <text x="20" y="315" font-family="monospace" font-size="10" fill="#047857">Dynamic Constraint Mapping</text>
  </g>

  <path d="M 280 330 L 350 330" stroke="url(#emerald-glow)" stroke-width="2" stroke-dasharray="6,4" />
  <polygon points="350,326 360,330 350,334" fill="#34d399" />

  <!-- Step 2: Generative Reasoning & Prompt Flow -->
  <g transform="translate(360, 140)">
    <rect width="240" height="380" rx="12" fill="#06201b" stroke="#059669" stroke-width="1.5" filter="url(#glow-filter-3)" fill-opacity="0.95" />
    <rect x="0" y="0" width="240" height="40" rx="12" fill="#064e3b" />
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">02 // LLM REASONING CORE</text>

    <g transform="translate(20, 65)">
      <rect width="200" height="190" rx="6" fill="#021411" stroke="#134e4a" />
      
      <text x="14" y="26" font-family="monospace" font-size="10" fill="#a7f3d0">PROMPT CHAIN ACTIVE</text>
      
      <rect x="14" y="38" width="170" height="26" rx="4" fill="#0b2e27" />
      <text x="22" y="55" font-family="monospace" font-size="9" fill="#34d399">Stage 1: Attraction Filter</text>

      <rect x="14" y="72" width="170" height="26" rx="4" fill="#0b2e27" />
      <text x="22" y="89" font-family="monospace" font-size="9" fill="#34d399">Stage 2: Route Geo-Cluster</text>

      <rect x="14" y="106" width="170" height="26" rx="4" fill="#0b2e27" />
      <text x="22" y="123" font-family="monospace" font-size="9" fill="#34d399">Stage 3: Budget Balancing</text>

      <text x="14" y="160" font-family="monospace" font-size="10" fill="#6ee7b7">GUARDRAILS: VERIFIED</text>
      <text x="14" y="176" font-family="monospace" font-size="9" fill="#a7f3d0">Hallucination Gate: Passed</text>
    </g>

    <text x="20" y="315" font-family="monospace" font-size="11" fill="#a7f3d0">Structured Context Engine</text>
    <text x="20" y="335" font-family="monospace" font-size="10" fill="#34d399">Spatial & Temporal Balancing</text>
  </g>

  <path d="M 600 330 L 670 330" stroke="url(#emerald-glow)" stroke-width="2" />
  <polygon points="670,326 680,330 670,334" fill="#34d399" />

  <!-- Step 3: Spatial Routing Optimization -->
  <g transform="translate(680, 160)">
    <rect width="200" height="340" rx="12" fill="#06201b" stroke="#134e4a" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="40" rx="12" fill="#0f3d36" />
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ecfdf5">03 // ROUTE CLUSTERING</text>

    <!-- Map Nodes Simulation -->
    <g transform="translate(20, 65)">
      <rect width="160" height="180" rx="6" fill="#021411" stroke="#134e4a" />
      
      <!-- Nodes & Connectors -->
      <circle cx="45" cy="45" r="7" fill="#34d399" />
      <circle cx="115" cy="65" r="7" fill="#34d399" />
      <circle cx="80" cy="130" r="7" fill="#34d399" />

      <line x1="45" y1="45" x2="115" y2="65" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" />
      <line x1="115" y1="65" x2="80" y2="130" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" />

      <text x="58" y="42" font-family="monospace" font-size="8" fill="#ffffff">Day 1: AM</text>
      <text x="120" y="80" font-family="monospace" font-size="8" fill="#ffffff">Day 1: PM</text>
      <text x="75" y="152" font-family="monospace" font-size="8" fill="#ffffff">Day 1: EVE</text>
    </g>

    <text x="20" y="295" font-family="monospace" font-size="11" fill="#6ee7b7">Transit Time Minimizer</text>
    <text x="20" y="315" font-family="monospace" font-size="10" fill="#047857">Proximity Optimization</text>
  </g>

  <path d="M 880 330 L 950 330" stroke="url(#emerald-glow)" stroke-width="2" />
  <polygon points="950,326 960,330 950,334" fill="#34d399" />

  <!-- Step 4: Final Itinerary Output -->
  <g transform="translate(960, 160)">
    <rect width="170" height="340" rx="12" fill="#06201b" stroke="#134e4a" stroke-width="1.5" />
    <rect x="0" y="0" width="170" height="40" rx="12" fill="#0f3d36" />
    <text x="20" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ecfdf5">04 // ITINERARY</text>

    <g transform="translate(15, 65)">
      <rect width="140" height="60" rx="6" fill="#0b2e27" stroke="#115e59" />
      <text x="10" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a7f3d0">DAY 01</text>
      <text x="10" y="38" font-family="sans-serif" font-size="11" fill="#ffffff">Old Quarter Walk</text>
      <text x="10" y="50" font-family="monospace" font-size="9" fill="#6ee7b7">Est: $32 • 3.2km</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="140" height="60" rx="6" fill="#0b2e27" stroke="#115e59" />
      <text x="10" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a7f3d0">DAY 02</text>
      <text x="10" y="38" font-family="sans-serif" font-size="11" fill="#ffffff">Museum & Culinary</text>
      <text x="10" y="50" font-family="monospace" font-size="9" fill="#6ee7b7">Est: $45 • 1.8km</text>
    </g>

    <text x="20" y="295" font-family="monospace" font-size="11" fill="#6ee7b7">Exportable Schedule</text>
    <text x="20" y="315" font-family="monospace" font-size="10" fill="#047857">100% Customized Flow</text>
  </g>

  <g transform="translate(60, 630)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#134e4a" stroke-width="1" />
    <text x="0" y="25" font-family="monospace" font-size="11" fill="#047857">GEN_AI_MODEL: STRUCTURED_PLANNER // OPTIMIZER: GEO_TIME_TSP</text>
    <text x="940" y="25" font-family="monospace" font-size="11" fill="#34d399">JAGAN S // AI ENGINEER</text>
  </g>
</svg>
